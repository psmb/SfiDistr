worker_processes 1;
pid /tmp/sfi-maintenance.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log /dev/stdout;
    server {
        listen 80;
        default_type text/html;
        charset utf-8;
        add_header Retry-After 600 always;
        add_header Cache-Control "no-store" always;
        return 503 '<!doctype html><html lang="ru"><meta charset="utf-8"><title>Технические работы</title><h1>Технические работы</h1><p>Сайт скоро снова будет доступен.</p></html>';
    }
}
