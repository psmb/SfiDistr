user www-data;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_max_body_size 1024m;
    server {
        listen 80;
        server_name www.sfi.ru;
        return 301 https://sfi.ru$request_uri;
    }
    server {
        listen 80 default_server;
        server_name _;
        root /data/www/Web;
        index index.php;
        include /data/www/server/nginx/conf.d/*.conf;
        location / { try_files $uri /index.php?$args; }
        location ~* \.(?:sql(?:\.(?:gz|bz2|xz))?|dump|bak)$ { return 404; }
        location ~ /\. { deny all; }
        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param FLOW_CONTEXT __FLOW_CONTEXT__;
            fastcgi_param FLOW_REWRITEURLS 1;
            fastcgi_read_timeout 600;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 32 4k;
            fastcgi_busy_buffers_size 64k;
            fastcgi_pass 127.0.0.1:9000;
        }
        location ~* \.(?:jpe?g|gif|png|ico|svg|eot|ttf|otf|woff2?|css|js)$ {
            try_files $uri =404;
            expires max;
        }
    }
    include /data/www/server/nginx/hosts.d/*.conf;
}
