Neos:
  Flow:
    object:
      registerFunctionalTestClasses: true
      includeClasses:
        # Upstream package tests use PHPUnit 10 attributes.
        # Only this distribution's tests are run with Flow 8.4 / PHPUnit 9.
        'Neos.ContentRepository': ['^Neos\\ContentRepository\\(?!Tests\\).*']
        'Neos.Fusion': ['^Neos\\Fusion\\(?!Tests\\).*']
        'Neos.Fusion.Afx': ['^Neos\\Fusion\\Afx\\(?!Tests\\).*']
        'Neos.Media': ['^Neos\\Media\\(?!Tests\\).*']
        'Neos.Neos': ['^Neos\\Neos\\(?!Tests\\).*']
        'Neos.Party': ['^Neos\\Party\\(?!Tests\\).*']
    persistence:
      backendOptions:
        driver: pdo_sqlite
        path: '%FLOW_PATH_DATA%Temporary/Testing/neos84.sqlite'
    resource:
      collections:
        persistent:
          storage: defaultPersistentResourcesStorage
          target: localWebDirectoryPersistentResourcesTarget
  SwiftMailer:
    transport:
      type: 'Swift_NullTransport'
Yeebase:
  Graylog:
    host: ''
