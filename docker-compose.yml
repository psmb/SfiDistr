services:
  redis:
    restart: always
    image: redis:7.4-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    volumes:
      - redis-data:/data
  db:
    restart: always
    image: mariadb:10.3
    volumes:
      - db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: db
      MYSQL_USER: admin
      MYSQL_PASSWORD: pass
  web:
    restart: always
    volumes:
      - app-data:/data/www-provisioned/Data
      - /data/www-provisioned/Web/_Resources
      - /mnt/vol2/docker/sites/kabinet/www/moodledata/repository/ltso/accred:/data/www-provisioned/Web/docs
      - /home/umo/umo:/data/www-provisioned/Web/umo
    tmpfs:
      - /data/www-provisioned/Web/_Resources/Static:uid=80,gid=80,mode=0755
    image: ghcr.io/psmb/sfidistr:master
    hostname: 'sfiru'
    networks:
      - default
      - main
    environment:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - SFI_PM_USER
      - SFI_PM_PASSWORD
      - GA_SECRET
      - GA_DEVKEY
      - SFI_API_AUTH
      - IMPORT_GITHUB_PUB_KEYS
      - FLOW_CONTEXT=Production
      - FLOW_HTTP_TRUSTED_PROXIES=172.19.0.7
    labels:
      - "neos=true"
      - "traefik.enable=true"
      - "traefik.port=80"
      - "traefik.default.protocol=http"
      - "traefik.docker.network=main"
      - "traefik.frontend.rule=Host:sfi.ru,www.sfi.ru"
    ports:
      - '80'
    depends_on:
      - db
      - redis
volumes:
  db-data:
  app-data:
  redis-data:
networks:
  main:
    external: true
    name: main
