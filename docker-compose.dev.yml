services:
    redis:
        image: redis:7.4-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    db:
        image: mariadb:10.3
        volumes:
            - db-data:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: pass
            MYSQL_DATABASE: db
            MYSQL_USER: admin
            MYSQL_PASSWORD: pass
    web:
        labels:
            - "neos=true"
        volumes:
            - ./:/data/www:rw,delegated
            - /data/www/Data
        build: .
        image: sfi-neos84:local
        environment:
            FLOW_CONTEXT: Development
        hostname: "sfiru"
        networks:
            - default
            - main
        ports:
            - "1001:80"
        depends_on:
            - db
            - redis
volumes:
    db-data:
networks:
    main:
        external: true
        name: main
